<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src {{cspSource}} https: data:; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}} 'unsafe-inline';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{variablesCssUri}}" />
    <link rel="stylesheet" href="{{mainCssUri}}" />
    <link rel="stylesheet" href="{{cardsCssUri}}" />
    <title>ChatGPT</title>
  </head>
  <body>
    <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="g-gpt" x1="0" y1="1" x2="1" y2="0"><stop class="s0" offset="0" /><stop class="s1" offset="1" /></linearGradient>
        <linearGradient id="g-o-series" x1="0" y1="1" x2="1" y2="0"><stop class="s0" offset="0" /><stop class="s1" offset="1" /></linearGradient>
        <linearGradient id="g-other" x1="0" y1="1" x2="1" y2="0"><stop class="s0" offset="0" /><stop class="s1" offset="1" /></linearGradient>
        <linearGradient id="g-warn" x1="0" y1="1" x2="1" y2="0"><stop class="s0" offset="0" /><stop class="s1" offset="1" /></linearGradient>
        <linearGradient id="g-low" x1="0" y1="1" x2="1" y2="0"><stop class="s0" offset="0" /><stop class="s1" offset="1" /></linearGradient>
        <linearGradient id="cgmMark" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#10A37F" />
          <stop offset="100%" stop-color="#00D26A" />
        </linearGradient>
      </defs>
    </svg>

    <div class="ambient" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand-row">
        <div class="brand">
          <svg class="brand-mark" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="url(#cgmMark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2a10 10 0 1 0 10 10H12V2z" />
            <path d="M12 12L2.5 7.5" />
            <path d="M12 12v10" />
            <circle cx="12" cy="12" r="3" fill="#10A37F" />
          </svg>
          <div class="brand-text">
            <span class="brand-name">ChatGPT</span>
            <button id="health" class="health hidden" type="button" data-key="health" title="Show connections">
              <i class="health-dot"></i><span id="health-text"></span>
            </button>
          </div>
        </div>

        <div class="brand-actions">
          <button id="collapse-all" class="icon-btn" aria-label="Collapse all accounts" title="Collapse all">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2.5" y="2.5" width="11" height="11" rx="2.5" /><path d="M5.5 8h5" />
            </svg>
          </button>
          <button id="refresh-all" class="icon-btn" aria-label="Refresh quotas" title="Refresh quotas">
            <svg class="spin-target" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M13.2 6.2A5.3 5.3 0 0 0 3.6 4.4" />
              <path d="M2.8 9.8a5.3 5.3 0 0 0 9.6 1.8" />
              <path d="M13.4 2.6v3.6H9.8" />
              <path d="M2.6 13.4V9.8h3.6" />
            </svg>
          </button>
          <button id="add-account" class="icon-btn icon-btn-primary" aria-label="Log in with Browser" title="Log in with Browser">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
              <path d="M8 3.5v9M3.5 8h9" />
            </svg>
          </button>
        </div>
      </div>

      <nav class="segmented" role="tablist" aria-label="Views">
        <button id="tab-accounts" class="seg active" data-tab="accounts" role="tab" aria-selected="true" aria-controls="accounts-tab">
          Accounts <span class="seg-count" id="accounts-count"></span>
        </button>
        <button id="tab-usage" class="seg" data-tab="usage" role="tab" aria-selected="false" aria-controls="usage-tab">
          Usage <span class="seg-count" id="usage-count"></span>
        </button>
      </nav>
    </header>

    <main>
      <!-- ── Accounts Tab ────────────────────────────────────────────────── -->
      <section id="accounts-tab" role="tabpanel" aria-labelledby="tab-accounts">
        <section class="section hidden" id="integrations-section">
          <div class="section-head">
            <span class="eyebrow">Connections</span>
            <span class="section-meta" id="integrations-meta"></span>
          </div>
          <div id="integrations" class="connections"></div>
        </section>

        <div id="hero"></div>

        <section class="section" id="rotation-section">
          <div class="section-head">
            <span class="eyebrow">Rotation</span>
            <span class="section-meta" id="accounts-meta"></span>
          </div>
          <div id="accounts" class="rotation"></div>
        </section>

        <div id="empty" class="onboard hidden">
          <div class="onboard-mark" aria-hidden="true">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#10A37F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a10 10 0 1 0 10 10H12V2z" />
              <path d="M12 12L2.5 7.5" />
              <path d="M12 12v10" />
            </svg>
          </div>
          <div class="onboard-title">Connect your ChatGPT account</div>
          <p class="onboard-desc">
            Sign in via your browser to run GPT-4o, o1, and o3-mini in Copilot Chat, Claude Code, and Codex <b>without any API key</b>.
          </p>
          <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 14px;">
            <button id="add-account-empty" class="btn btn-primary btn-cta">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" /></svg>
              Log in with Browser
            </button>
          </div>
        </div>
      </section>

      <!-- ── Usage Tab ────────────────────────────────────────────────────── -->
      <section id="usage-tab" class="hidden" role="tabpanel" aria-labelledby="tab-usage">
        <div id="usage-ranges" class="ranges hidden" role="radiogroup" aria-label="Time range">
          <button class="range" type="button" role="radio" aria-checked="false" data-range="hour" title="Since the start of the current hour">This hour</button>
          <button class="range" type="button" role="radio" aria-checked="false" data-range="today" title="Since midnight">Today</button>
          <button class="range" type="button" role="radio" aria-checked="false" data-range="yesterday" title="Yesterday, midnight to midnight">Yesterday</button>
          <button class="range" type="button" role="radio" aria-checked="false" data-range="week" aria-label="Last 7 days" title="Today and the 6 days before">7 days</button>
          <button class="range" type="button" role="radio" aria-checked="false" data-range="month" aria-label="Last 30 days" title="Today and the 29 days before">30 days</button>
          <button class="range" type="button" role="radio" aria-checked="false" data-range="all" aria-label="All time" title="Everything recorded">All</button>
        </div>
        <div id="usage-body"></div>
        <div id="usage-empty" class="empty glass hidden">
          <div class="empty-title">No traffic yet</div>
          <p class="empty-desc">
            Token usage appears here once a model answers through Copilot, Claude Code, or Codex.
          </p>
        </div>
        <div id="usage-actions" class="usage-actions hidden">
          <button id="clear-history" class="text-btn" data-key="clear-history" title="Clear history">Clear history…</button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <button id="open-logs" class="link">Open logs</button>
    </footer>

    <div id="menu" class="menu hidden" role="menu"></div>

    <script src="{{appJsUri}}"></script>
  </body>
</html>
